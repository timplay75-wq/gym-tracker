name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

      # Серверные тесты на встроенном раннере Node, без внешних зависимостей
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
