name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Позволяет запустить публикацию вручную из вкладки Actions
  workflow_dispatch:

# Нужны для публикации через официальные actions Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: не отменяем текущую, но лишние в очереди убираем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          # Адрес бэкенда вшивается в бандл на этапе сборки.
          # Задаётся в Settings → Secrets and variables → Actions → Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Pages отдаёт проект из подпапки /<репозиторий>/, в отличие от
          # Vercel и своего домена, где приложение лежит в корне.
          VITE_BASE: /gym-tracker/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
